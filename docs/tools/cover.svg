<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" preserveAspectRatio="xMidYMid slice">
  <!-- The cover of the PDF documentation (docs/tools/makepdf.py puts it on the first page). 1 unit = 1 mm. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#0f0a30"/>
      <stop offset="0.5" stop-color="#271a72"/>
      <stop offset="1" stop-color="#4a31b8"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="0.78" cy="0.17" r="0.55">
      <stop offset="0" stop-color="#00c2d4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#00c2d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowViolet" cx="0.12" cy="0.92" r="0.6">
      <stop offset="0" stop-color="#8f74ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8f74ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9a8ff"/>
    </linearGradient>
    <linearGradient id="ringB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf3ff"/>
      <stop offset="1" stop-color="#00a3b4"/>
    </linearGradient>
    <linearGradient id="titleG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8ff3ff"/>
    </linearGradient>
    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.28" fill="#ffffff" fill-opacity="0.16"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="glowblur" x="-30%" y="-40%" width="160%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>

  <rect width="210" height="297" fill="url(#bg)"/>
  <rect width="210" height="297" fill="url(#dots)"/>
  <rect width="210" height="297" fill="url(#glowTeal)"/>
  <rect width="210" height="297" fill="url(#glowViolet)"/>

  <!-- orbits around the rings -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="0.35">
    <circle cx="105" cy="100" r="60"/>
    <circle cx="105" cy="100" r="78"/>
    <circle cx="105" cy="100" r="98" stroke-dasharray="0.6 2.2"/>
    <circle cx="105" cy="100" r="118" stroke-dasharray="0.6 3.4"/>
  </g>
  <g fill="#ffffff">
    <circle cx="180" cy="100" r="1.4" fill-opacity="0.85"/>
    <circle cx="66" cy="138" r="1.1" fill-opacity="0.6"/>
    <circle cx="160" cy="45" r="0.9" fill-opacity="0.7"/>
    <circle cx="86" cy="36" r="1.3" fill="#7cf3ff" fill-opacity="0.9"/>
    <circle cx="198" cy="150" r="0.9" fill-opacity="0.5"/>
    <circle cx="44" cy="86" r="0.8" fill-opacity="0.5"/>
    <circle cx="150" cy="170" r="1" fill="#7cf3ff" fill-opacity="0.6"/>
  </g>

  <!-- the Ring logo (B:ing\marketing\graphics	hering.jpg, enlarged in ring-logo.png) on a white card -->
  <rect x="42" y="66" width="136" height="80" rx="9" fill="#0b0827" fill-opacity="0.55" filter="url(#shadow)"/>
  <rect x="38" y="60" width="136" height="80" rx="9" fill="#00c2d4" fill-opacity="0.35" filter="url(#glowblur)"/>
  <rect x="40" y="62" width="130" height="76" rx="8" fill="#ffffff"/>
  <image x="50" y="67" width="110" height="57" href="@RINGLOGO@" preserveAspectRatio="xMidYMid meet"/>

  <!-- title block -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
    <rect x="20" y="166" width="22" height="1.6" rx="0.8" fill="#00d4e6"/>
    <text x="19" y="190" font-size="26" font-weight="800" fill="url(#titleG)" letter-spacing="-0.4">RingDotNet</text>
    <text x="20" y="203" font-size="7.2" font-weight="400" fill="#ffffff" fill-opacity="0.92">Use .NET classes and methods</text>
    <text x="20" y="212" font-size="7.2" font-weight="400" fill="#ffffff" fill-opacity="0.92">from Ring programs</text>
  </g>

  <!-- a program, as on the first page of the manual -->
  <g>
    <rect x="20" y="225" width="170" height="38" rx="3" fill="#0b0827" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.18" stroke-width="0.3"/>
    <circle cx="26" cy="230" r="1.1" fill="#ff5f57"/><circle cx="30" cy="230" r="1.1" fill="#febc2e"/><circle cx="34" cy="230" r="1.1" fill="#28c840"/>
    <g font-family="'Cascadia Code','JetBrains Mono',Consolas,'SF Mono',Menlo,monospace" font-size="3.7">
      <text x="26" y="238.5"><tspan fill="#c4b5ff">load</tspan><tspan fill="#a5f0c0"> "dotnet.ring"</tspan></text>
      <text x="26" y="244"><tspan fill="#c4b5ff">oSB</tspan><tspan fill="#e6e8f5"> = </tspan><tspan fill="#c4b5ff">new</tspan><tspan fill="#7cf3ff"> StringBuilder</tspan><tspan fill="#e6e8f5">(</tspan><tspan fill="#a5f0c0">"Hello"</tspan><tspan fill="#e6e8f5">)</tspan></text>
      <text x="26" y="249.5"><tspan fill="#e6e8f5">oSB.</tspan><tspan fill="#7cf3ff">Append</tspan><tspan fill="#e6e8f5">(</tspan><tspan fill="#a5f0c0">", .NET!"</tspan><tspan fill="#e6e8f5">)</tspan></text>
      <text x="26" y="255"><tspan fill="#ffd479">?</tspan><tspan fill="#e6e8f5"> oSB.</tspan><tspan fill="#7cf3ff">ToString</tspan><tspan fill="#e6e8f5">()   </tspan><tspan fill="#8a86b8"># Hello, .NET!</tspan></text>
    </g>
  </g>

  <!-- footer -->
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" fill="#ffffff">
    <line x1="20" y1="276" x2="190" y2="276" stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.3"/>
    <text x="20" y="284" font-size="3.8" font-weight="600" letter-spacing="0.5" fill-opacity="0.95">DOCUMENTATION</text>
    <text x="190" y="284" font-size="3.8" text-anchor="end" fill-opacity="0.8">Version 1.0  ·  Ring 1.28  ·  .NET 9</text>
  </g>
</svg>
